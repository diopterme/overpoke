name: release

# v0.2.0 같은 태그를 push하면 Windows·Mac 설치 파일과 업데이트용 latest.json을 초안 릴리즈에 올린다
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: '초과콕 __VERSION__'
          releaseBody: |
            <!-- 공개하기 전에 이번 버전의 핵심을 한두 문장으로 적으세요 -->

            ## 다운로드

            - Windows: [overpoke___VERSION___x64-setup.exe](https://github.com/diopterme/overpoke/releases/download/v__VERSION__/overpoke___VERSION___x64-setup.exe)
            - Mac (M1 이후): [overpoke___VERSION___aarch64.dmg](https://github.com/diopterme/overpoke/releases/download/v__VERSION__/overpoke___VERSION___aarch64.dmg)

            Assets의 다른 파일은 자동 업데이트에 쓰는 파일이라 받지 않아도 됩니다. 설치 방법과 경고창 대처법은 [사용설명서](https://diopterme.github.io/overpoke/manual.html)에 있습니다.

            <!-- 바뀐 점을 "## 추가", "## 변경", "## 수정" 아래에 한 줄씩 적으세요 -->
          generateReleaseNotes: true
          releaseDraft: true
